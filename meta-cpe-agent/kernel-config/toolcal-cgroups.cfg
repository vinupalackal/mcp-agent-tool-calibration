# Kernel options toolcal uses for exact per-tool measurement.
# Without them it falls back to rusage (less accurate memory, no task counts).
CONFIG_CGROUPS=y
CONFIG_CGROUP_SCHED=y
CONFIG_CGROUP_CPUACCT=y
CONFIG_MEMCG=y
CONFIG_CGROUP_PIDS=y
CONFIG_BLK_CGROUP=y
# Pressure stall information (Linux 4.20 and later); used for PSI figures.
CONFIG_PSI=y
