# meta-cpe-agent: CPE Agent lab tooling for RDK-B builds
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "cpe-agent"
BBFILE_PATTERN_cpe-agent = "^${LAYERDIR}/"
BBFILE_PRIORITY_cpe-agent = "10"

# cjson comes from meta-oe (openembedded-layer), which RDK-B builds include.
LAYERDEPENDS_cpe-agent = "core openembedded-layer"
LAYERSERIES_COMPAT_cpe-agent = "dunfell kirkstone scarthgap"
